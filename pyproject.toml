[project]
name = "cv-renderer"
version = "0.1.0"
description = "Profile-driven CV renderer: one YAML source of truth, tag-filtered tailored profiles, HTML/PDF export, content lint"
readme = "README.md"
license = "MIT"
authors = [{ name = "Melis Kilic" }]
requires-python = ">=3.12"
keywords = ["cv", "resume", "yaml", "jinja2", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# PDF export shells out to Chromium via Playwright; HTML-only users don't pay for it.
pdf = ["playwright>=1.40"]

[project.scripts]
cv-renderer = "cv_renderer.render:main"

[project.urls]
Repository = "https://github.com/melisklc0/cv-renderer"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "playwright>=1.40",
    "pytest>=8",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_renderer"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
